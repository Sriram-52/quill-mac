name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: |
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$XCODE" ]; then sudo xcode-select -s "$XCODE"; fi
          xcodebuild -version
          swift --version

      - name: Build Quill.app
        run: scripts/make-app.sh --no-install
        env:
          QUILL_VERSION: 0.0.0-ci
          QUILL_BUILD: ${{ github.run_number }}

      - name: Zip app
        run: ditto -c -k --keepParent build/Quill.app build/Quill-ci.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Quill-ci-${{ github.sha }}
          path: build/Quill-ci.zip
          retention-days: 14
